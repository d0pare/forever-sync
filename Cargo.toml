[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2024"
publish = false

[workspace.dependencies]
foreversync-core = { path = "crates/foreversync-core" }
foreversync-addons = { path = "crates/foreversync-addons" }
foreversync-git = { path = "crates/foreversync-git" }
foreversync-github = { path = "crates/foreversync-github" }

anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
full_moon = "3"
keyring = "4"
git2 = { version = "0.21", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
tempfile = "3"
thiserror = "2"
unicode-normalization = "0.1"
ureq = { version = "3", features = ["json"] }

# Profiles must live in the workspace root; see https://tauri.app/concept/size/
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
